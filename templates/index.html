<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoCache FX — Engine Monitor & Chart</title>
    
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <!-- Chart.js + Luxon Time Adapter + Streaming Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-streaming@2.0.0/dist/chartjs-plugin-streaming.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0f17; color: #e6edf3; padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { max-width: 900px; width: 100%; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; padding-bottom: 1rem; }
        .logo { font-size: 1.4rem; font-weight: 700; color: #f0f6fc; }
        .logo span { color: #58a6ff; }
        .status-badge { background: #238636; color: #fff; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        
        /* Chart Container */
        .chart-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 1.25rem; max-width: 900px; width: 100%; margin-bottom: 1.5rem; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .chart-title { font-size: 1rem; font-weight: 600; color: #8b949e; }
        .chart-container { position: relative; height: 260px; width: 100%; }
        
        /* Grid Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; max-width: 900px; width: 100%; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 1.25rem; transition: all 0.2s ease; }
        .currency { color: #8b949e; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; }
        .rate { font-size: 1.7rem; font-weight: 700; margin: 0.5rem 0; color: #ffffff; font-family: monospace; }
        .meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #8b949e; align-items: center; }
        .hit { color: #3fb950; font-weight: 700; background: rgba(63, 185, 80, 0.1); padding: 2px 6px; border-radius: 4px; }
        .miss { color: #f85149; font-weight: 700; background: rgba(248, 81, 73, 0.1); padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="logo">NanoCache<span>FX</span></div>
            <p style="color: #8b949e; font-size: 0.85rem; margin-top: 4px;">Real-Time Socket.IO Cache Stream</p>
        </div>
        <div id="status" class="status-badge">Connecting...</div>
    </div>

    <!-- Live Stream Chart -->
    <div class="chart-card">
        <div class="chart-header">
            <div class="chart-title">EUR / USD Real-Time Price Stream</div>
        </div>
        <div class="chart-container">
            <canvas id="fxChart"></canvas>
        </div>
    </div>

    <!-- Currency Ticker Cards -->
    <div class="grid">
        <div class="card" id="card-EUR">
            <div class="currency">EUR / USD</div>
            <div class="rate" id="rate-EUR">1.0850</div>
            <div class="meta">
                <span id="status-EUR" class="hit">HIT</span>
                <span id="time-EUR">--:--:--</span>
            </div>
        </div>
        <div class="card" id="card-GBP">
            <div class="currency">GBP / USD</div>
            <div class="rate" id="rate-GBP">1.2720</div>
            <div class="meta">
                <span id="status-GBP" class="hit">HIT</span>
                <span id="time-GBP">--:--:--</span>
            </div>
        </div>
        <div class="card" id="card-UGX">
            <div class="currency">USD / UGX</div>
            <div class="rate" id="rate-UGX">3710.00</div>
            <div class="meta">
                <span id="status-UGX" class="hit">HIT</span>
                <span id="time-UGX">--:--:--</span>
            </div>
        </div>
        <div class="card" id="card-JPY">
            <div class="currency">USD / JPY</div>
            <div class="rate" id="rate-JPY">155.40</div>
            <div class="meta">
                <span id="status-JPY" class="hit">HIT</span>
                <span id="time-JPY">--:--:--</span>
            </div>
        </div>
    </div>

    <script>
        const statusBadge = document.getElementById('status');

        // Initialize Chart.js Streaming Instance
        const ctx = document.getElementById('fxChart').getContext('2d');
        const fxChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'EUR/USD Rate',
                    borderColor: '#58a6ff',
                    backgroundColor: 'rgba(88, 166, 255, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 2,
                    data: []
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'realtime',
                        realtime: {
                            duration: 30000, // Show last 30 seconds of ticks
                            refresh: 500,
                            delay: 1000
                        },
                        grid: { color: '#21262d' },
                        ticks: { color: '#8b949e' }
                    },
                    y: {
                        grid: { color: '#21262d' },
                        ticks: { color: '#8b949e' }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });

        // Setup Socket.IO connection with fallback transports
        const socket = io({ 
            transports: ['polling', 'websocket'],
            auth: { api_key: "nc_live_8f91a2b3c4d5" } 
        });

        socket.on('connect', () => {
            statusBadge.innerText = 'ONLINE';
            statusBadge.style.background = '#238636';
        });

        socket.on('disconnect', () => {
            statusBadge.innerText = 'OFFLINE';
            statusBadge.style.background = '#da3633';
        });

        socket.on('fx_tick', (data) => {
            const curr = data.currency;
            const rate = parseFloat(data.rate);

            // Update ticker cards
            const rateElem = document.getElementById(`rate-${curr}`);
            const statusElem = document.getElementById(`status-${curr}`);
            const timeElem = document.getElementById(`time-${curr}`);

            if (rateElem) {
                rateElem.innerText = data.rate;
                statusElem.innerText = data.status;
                statusElem.className = data.status === 'HIT' ? 'hit' : 'miss';
                timeElem.innerText = data.timestamp;
            }

            // Stream EUR/USD ticks directly to the chart
            if (curr === 'EUR') {
                fxChart.data.datasets[0].data.push({
                    x: Date.now(),
                    y: rate
                });
                fxChart.update('quiet');
            }
        });
    </script>
</body>
</html>
