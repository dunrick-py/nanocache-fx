<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoCache FX | Real-Time Terminal</title>
    <!-- Include Socket.io client mirror -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e11;
            color: #eaecef;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2b2f36;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .status-badge {
            background-color: #2b3139;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            color: #f0b90b;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #181a20;
            border: 1px solid #2b2f36;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.1s ease;
        }
        .currency-name {
            font-size: 14px;
            color: #848e9c;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .rate-display {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            font-family: monospace;
        }
        .metric-badge {
            display: inline-block;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .hit { background-color: rgba(14, 203, 129, 0.15); color: #0ecb81; }
        .miss { background-color: rgba(246, 70, 93, 0.15); color: #f6465d; }
        .timestamp { font-size: 11px; color: #474d57; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1 style="margin: 0; font-size: 28px;">NanoCache <span style="color: #0ecb81;">FX</span></h1>
            <p style="margin: 5px 0 0 0; color: #848e9c; font-size: 14px;">High-Frequency WebSockets Feed (500ms Refresh)</p>
        </div>
        <div id="connection-status" class="status-badge">Connecting to Terminal...</div>
    </div>

    <div class="grid">
        <!-- EUR CARD -->
        <div class="card" id="card-EUR">
            <div class="currency-name">EUR / USD</div>
            <div class="rate-display" id="rate-EUR">0.0000</div>
            <div><span id="badge-EUR" class="metric-badge miss">MISS</span></div>
            <div class="timestamp" id="time-EUR">--:--:--</div>
        </div>

        <!-- GBP CARD -->
        <div class="card" id="card-GBP">
            <div class="currency-name">GBP / USD</div>
            <div class="rate-display" id="rate-GBP">0.0000</div>
            <div><span id="badge-GBP" class="metric-badge miss">MISS</span></div>
            <div class="timestamp" id="time-GBP">--:--:--</div>
        </div>

        <!-- UGX CARD -->
        <div class="card" id="card-UGX">
            <div class="currency-name">USD / UGX</div>
            <div class="rate-display" id="rate-UGX">0.0000</div>
            <div><span id="badge-UGX" class="metric-badge miss">MISS</span></div>
            <div class="timestamp" id="time-UGX">--:--:--</div>
        </div>

        <!-- JPY CARD -->
        <div class="card" id="card-JPY">
            <div class="currency-name">USD / JPY</div>
            <div class="rate-display" id="rate-JPY">0.0000</div>
            <div><span id="badge-JPY" class="metric-badge miss">MISS</span></div>
            <div class="timestamp" id="time-JPY">--:--:--</div>
        </div>
    </div>
</div>

<script>
    // Initialize open WebSockets pipe back to our Flask app
    const socket = io();
    const statusLabel = document.getElementById('connection-status');

    socket.on('connect', () => {
        statusLabel.innerText = "📡 Terminal Live";
        statusLabel.style.color = "#0ecb81";
        statusLabel.style.backgroundColor = "rgba(14, 203, 129, 0.1)";
    });

    socket.on('disconnect', () => {
        statusLabel.innerText = "🔌 Disconnected";
        statusLabel.style.color = "#f6465d";
        statusLabel.style.backgroundColor = "rgba(246, 70, 93, 0.1)";
    });

    // Catch the background thread price pump
    socket.on('ticker_update', (data) => {
        const currency = data.currency;
        
        const rateEl = document.getElementById(`rate-${currency}`);
        const badgeEl = document.getElementById(`badge-${currency}`);
        const timeEl = document.getElementById(`time-${currency}`);

        if (rateEl) {
            // Update rates and format display
            rateEl.innerText = parseFloat(data.rate).toFixed(currency === 'UGX' ? 2 : 4);
            timeEl.innerText = data.timestamp;
            
            // Toggle cache badges dynamically
            badgeEl.innerText = data.status;
            if (data.status === "HIT") {
                badgeEl.className = "metric-badge hit";
            } else {
                badgeEl.className = "metric-badge miss";
            }
        }
    });
</script>
</body>
</html>
